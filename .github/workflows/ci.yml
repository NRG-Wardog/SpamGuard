name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  data-pipeline-tests:
    name: Data pipeline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile pipeline modules
        run: python -m compileall -q spamguard_data tests/test_data_pipeline.py

      - name: Run deterministic data tests
        run: python -m unittest tests.test_data_pipeline -v
